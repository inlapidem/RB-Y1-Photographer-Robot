[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geekseek"
version = "0.1.0"
description = "Event-driven camera robot kiosk runtime"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.40",
  "fastapi>=0.115",
  "httpx>=0.28",
  "mediapipe>=0.10",
  "opencv-python>=4.9",
  "pygame>=2.6",
  "PyYAML>=6.0",
  "segno>=1.6",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
cad = [
  "cadquery>=2.8,<3",
]
rby1 = [
  "rby1-sdk>=0.10,<0.11",
]
dev = [
  "pytest>=8.0,<9",
]

[project.scripts]
geekseek = "geekseek.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
