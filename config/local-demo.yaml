runtime:
  robot: rviz
  capture: webapp
  move_seconds: 1.2
  capture_seconds: 0.2
  person_sensor: mediapipe
  camera_index: 0
  camera_fps: 15.0
  camera_width: 1280
  camera_height: 960
  camera_fourcc: MJPG
  framing_dataset_dir: calibration/webcam_skeleton_1280x960
  debug_window: true

  # 손님용 사진 페이지 (QR). Tailscale Funnel이 아래 로컬 포트를 진짜 인증서가
  # 붙은 공개 주소로 내보낸다:  sudo tailscale funnel --bg 8080
  # 비워두면 갤러리도 QR도 뜨지 않는다.
  gallery_base_url: "https://phorce.<your-tailnet>.ts.net"
  gallery_port: 8080

web:
  host: 0.0.0.0
  port: 8443
  ssl_keyfile: certs/key.pem
  ssl_certfile: certs/cert.pem
