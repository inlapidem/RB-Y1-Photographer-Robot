<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GeekSeek iPhone Live Camera</title>
<style>
  body { margin: 0; background: #10131a; color: #eef2ff; font-family: -apple-system, sans-serif; }
  .preview { position: relative; width: 100%; aspect-ratio: 3 / 4; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; display: block; object-fit: cover; }
  .grid { position: absolute; inset: 0; pointer-events: none; }
  .grid i { position: absolute; display: block; background: rgba(255,255,255,.48); }
  .grid .v { top: 0; bottom: 0; width: 1px; }
  .grid .h { left: 0; right: 0; height: 1px; }
  .grid .one.v { left: 33.333%; } .grid .two.v { left: 66.666%; }
  .grid .one.h { top: 33.333%; } .grid .two.h { top: 66.666%; }
  #status { padding: 12px; font-size: 14px; }
</style>
</head>
<body>
<div class="preview">
  <video id="v" autoplay playsinline muted></video>
  <div class="grid" aria-hidden="true">
    <i class="v one"></i><i class="v two"></i><i class="h one"></i><i class="h two"></i>
  </div>
</div>
<div id="status">카메라를 시작하는 중…</div>
<canvas id="c" style="display:none"></canvas>
<script>
  const statusEl = document.getElementById("status");
  const video = document.getElementById("v");
  const canvas = document.getElementById("c");
  let ws;
  let encoding = false;
  let sent = 0;

  function sendFrame() {
    if (encoding || !ws || ws.readyState !== WebSocket.OPEN) return;
    if (!video.videoWidth || ws.bufferedAmount > 1_000_000) return;
    encoding = true;
    // Always send a centered portrait 3:4 frame, independent of the camera's
    // native aspect ratio. The composition grid is UI-only and is not burned
    // into the saved JPEG, matching the iPhone Camera app behavior.
    const outputWidth = 480;
    const outputHeight = 640;
    const targetAspect = outputWidth / outputHeight;
    const sourceAspect = video.videoWidth / video.videoHeight;
    let sx = 0, sy = 0, sw = video.videoWidth, sh = video.videoHeight;
    if (sourceAspect > targetAspect) {
      sw = video.videoHeight * targetAspect;
      sx = (video.videoWidth - sw) / 2;
    } else {
      sh = video.videoWidth / targetAspect;
      sy = (video.videoHeight - sh) / 2;
    }
    canvas.width = outputWidth;
    canvas.height = outputHeight;
    canvas.getContext("2d").drawImage(video, sx, sy, sw, sh, 0, 0, outputWidth, outputHeight);
    canvas.toBlob((blob) => {
      try {
        if (blob && ws.readyState === WebSocket.OPEN) {
          ws.send(blob);
          sent += 1;
          statusEl.textContent = `실시간 전송 중 · ${sent} frames`;
        }
      } finally {
        encoding = false;
      }
    }, "image/jpeg", 0.92);
  }

  async function start() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();

    ws = new WebSocket(`wss://${location.host}/phone-ws`);
    ws.onopen = () => {
      statusEl.textContent = "연결됨 · 실시간 프레임 전송 시작";
      setInterval(sendFrame, 100); // 약 10 fps
    };
    ws.onclose = () => (statusEl.textContent = "연결이 끊겼습니다 · 페이지를 새로고침하세요");
    ws.onerror = () => (statusEl.textContent = "WebSocket 연결 오류");
    ws.onmessage = (event) => {
      if (event.data === "capture") sendFrame();
    };
  }

  start().catch((error) => (statusEl.textContent = `카메라 오류: ${error}`));
</script>
</body>
</html>
